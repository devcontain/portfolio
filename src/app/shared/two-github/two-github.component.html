@if (isOpen()) {
  <div class="preview" (click)="close()">
    <div class="cart-layer" (click)="$event.stopPropagation()">

      <button class="close-button" (click)="close()" aria-label="Close">✕</button>

      <div class="github-header">
        <h2>GitHub Portfolios</h2>
        <p>Explore my development journey and discover my projects.</p>
      </div>

      <div class="github-options">

        <a class="github-option old" href="URL_OLD" target="_blank" rel="noopener noreferrer">
          <span class="github-status">ARCHIVE</span>
          <h3>Portfolio Old</h3>
          <p>My earlier projects and first steps in web development.</p>
          <span class="github-link">Explore projects ↗</span>
        </a>

        <a class="github-option new" href="URL_NEW" target="_blank" rel="noopener noreferrer">
          <span class="github-status">CURRENT</span>
          <h3>Portfolio New</h3>
          <p>My latest projects, technologies and DevOps experience.</p>
          <span class="github-link">Explore projects ↗</span>
        </a>

      </div>
    </div>
  </div>
}
