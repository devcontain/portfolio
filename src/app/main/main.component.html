<section class="background-color">
    <div id="banner">
        <div class="headline">
            <h2>{{ languageService.currentHeader.bannertxta }}</h2>
            <h1>Sebastian Peters</h1>
            <div>
                <button (click)="scrollToId('projects')">
                    <span class="btn-span-one">{{ languageService.currentHeader.buttonleft }}</span>
                    <span class="btn-span-sec">{{ languageService.currentHeader.buttonleft }}</span>
                </button>

                <button (click)="scrollToId('contact')">
                    <span class="btn-span-one">{{ languageService.currentHeader.buttonright }}</span>
                    <span class="btn-span-sec">{{ languageService.currentHeader.buttonright }}</span>
                </button>
            </div>
        </div>

        <div class="line-content">

            <div class="line">
                <div class="line-left-pos">
                    <div class="arrow-box">
                        <span class="arrow" #arrowtrack>&#8595;</span>
                    </div>
                    <div class="line-left"></div>
                </div>
                <div class="line-right-pos">
                    <div class="mail-pos">
                        <a href="mailto:contact@devcontain.de" target="_blank">contact&#64;devcontain.de</a>
                    </div>
                    <div class="mail-img-pos">
                        <a href="mailto:contact@devcontain.de" target="_blank">
                            <div>
                                <img [src]="currentMail" alt="Mail" (mouseenter)="onMailEnter()"
                                    (mouseleave)="onMailLeave()" />
                            </div>
                        </a>
                        <img src="assets/img/point_green.png" alt="point" />
                    </div>
                    <div class="git-pos">
                        <a (click)="githubService.open()">
                            <div>
                                <img [src]="currentGithub" alt="GitHub" (mouseenter)="onGithubEnter()"
                                    (mouseleave)="onGithubLeave()" />
                            </div>
                        </a>
                        <img src="assets/img/point_green.png">
                    </div>
                    <div class="line-right"></div>
                </div>
            </div>
        </div>
        <app-marquee></app-marquee>
    </div>
</section>
